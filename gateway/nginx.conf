map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;

    # resolved per request, so the gateway survives a frontend restart
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # the backend times out at 60s
    proxy_read_timeout 75s;
    # just above the backend's 10 MB upload limit, so it answers the JSON error
    client_max_body_size 12m;

    location ~ ^/(api|swagger|scalar)(/|$) {
        proxy_pass ${BACKEND_URL};
        error_page 502 503 504 = @api_unavailable;
    }

    location / {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $frontend;
        error_page 502 503 504 = @ui_unavailable;
    }

    # same envelope as the backend's own errors
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"layanan API belum dapat dihubungi, coba lagi sebentar"}}';
    }

    location @ui_unavailable {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 2 always;
        return 503 '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="refresh" content="3"><title>Aplikasi sedang dinyalakan</title></head><body style="font-family:system-ui,sans-serif;padding:2rem;color:#173348"><h1 style="font-size:1.25rem;color:#06345d">Aplikasi sedang dinyalakan</h1><p>Halaman ini dimuat ulang sendiri dalam beberapa detik.</p></body></html>';
    }
}
