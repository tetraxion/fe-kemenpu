# One address for the whole application, as the assignment requires:
#   http://localhost:8080      web interface  -> frontend (this project)
#   http://localhost:8080/api  API            -> backend  (../backend)
#
# ${BACKEND_URL} is filled in when the container starts.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;

    # The frontend is resolved per request through Docker's DNS, so this
    # gateway keeps answering while that container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    # The backend bounds a request at 60s; this sits just behind it.
    proxy_read_timeout 75s;

    # API and its documentation. The backend runs as a separate project; when
    # it is not running, the answer is the JSON below instead of an HTML page.
    location ~ ^/(api|swagger|scalar)(/|$) {
        proxy_pass ${BACKEND_URL};
        error_page 502 503 504 = @api_unavailable;
    }

    # Everything else is the web interface.
    location / {
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $frontend;
        error_page 502 503 504 = @ui_unavailable;
    }

    # Same envelope as the backend's own errors, so API clients always get JSON.
    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 2 always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"layanan API belum dapat dihubungi, coba lagi sebentar"}}';
    }

    location @ui_unavailable {
        default_type "text/html; charset=utf-8";
        add_header Retry-After 2 always;
        return 503 '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="refresh" content="3"><title>Aplikasi sedang dinyalakan</title></head><body style="font-family:system-ui,sans-serif;padding:2rem;color:#173348"><h1 style="font-size:1.25rem;color:#06345d">Aplikasi sedang dinyalakan</h1><p>Halaman ini dimuat ulang sendiri dalam beberapa detik.</p></body></html>';
    }
}
