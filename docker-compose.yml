name: fe-irrigation

services:
  frontend:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8081}
    extra_hosts:
      # needed on Linux; Docker Desktop defines this name itself
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - frontend
