# The web interface with its gateway, as its own Compose project.
# Start it from this folder: `make up` or `docker compose up --build`.
#
#   http://localhost:8080       the interface
#   http://localhost:8080/api   the API of ../backend, forwarded by the gateway
#
# The backend is a separate project (../backend). The gateway reaches it
# through the port that project publishes on the host.
name: fe-irrigation

services:
  frontend:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build: ./gateway
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:8081}
    extra_hosts:
      # Docker Desktop defines this name by itself; on Linux it has to be mapped.
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - frontend
